name: Build IPlay IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix file structure
      run: |
        mkdir -p IPlay/Views IPlay/Services
        [ -d "Views" ] && mv Views/* IPlay/Views/ && rmdir Views
        [ -d "Services" ] && mv Services/* IPlay/Services/ && rmdir Services
        ls -la

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build project
      run: |
        xcodebuild \
          -project IPlay.xcodeproj \
          -scheme IPlay \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath ./build/IPlay.xcarchive \
          archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Add placeholder icon
      run: |
        APP_PATH="./build/IPlay.xcarchive/Products/Applications/IPlay.app"
        sips -s format png --resampleHeightWidth 1024 1024 /System/Library/CoreServices/DefaultDesktop.jpg --out "$APP_PATH/AppIcon.png" || echo "创建占位图标完成"
        plutil -insert CFBundleIconFiles -json '["AppIcon.png"]' "$APP_PATH/Info.plist" || echo "图标配置已存在"
        plutil -insert CFBundleIconName -string "AppIcon" "$APP_PATH/Info.plist" || echo "图标名配置已存在"

    - name: Export IPA
      run: |
        mkdir -p ./build/Payload
        cp -r ./build/IPlay.xcarchive/Products/Applications/IPlay.app ./build/Payload/
        cd ./build
        ditto -c -k --sequesterRsrc --keepParent Payload IPlay.ipa
        rm -rf Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: IPlay-IPA
        path: ./build/IPlay.ipa
        retention-days: 30
