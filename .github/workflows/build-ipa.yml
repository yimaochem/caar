name: Build IPlay IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix file structure
      run: |
        # 把 IPlay 文件夹里的内容移到根目录
        mv IPlay/* .
        mv IPlay/.* . 2>/dev/null || true
        rmdir IPlay

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build project
      run: |
        xcodebuild \
          -project IPlay.xcodeproj \
          -scheme IPlay \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath ./build/IPlay.xcarchive \
          archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: |
        mkdir -p ./build/Payload
        cp -r ./build/IPlay.xcarchive/Products/Applications/IPlay.app ./build/Payload/
        cd ./build
        zip -r IPlay.ipa Payload
        rm -rf Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: IPlay-IPA
        path: ./build/IPlay.ipa
        retention-days: 30
