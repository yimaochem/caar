name: Build IPlay IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix file structure (create symlinks)
      run: |
        ln -sf IPlay/Views Views
        ln -sf IPlay/Services Services
        ls -la

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build project
      run: |
        xcodebuild \
          -project IPlay.xcodeproj \
          -scheme IPlay \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath ./build/IPlay.xcarchive \
          archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Fix Info.plist and add icon
      run: |
        APP_PATH="./build/IPlay.xcarchive/Products/Applications/IPlay.app"
        
        # 用Python生成一个蓝色纯色图标
        python3 -c "
from PIL import Image
img = Image.new('RGB', (1024, 1024), color=(10, 132, 255))
img.save('$APP_PATH/AppIcon.png')
print('图标生成成功')
"
        
        # 补上必须的可执行文件名字段
        plutil -insert CFBundleExecutable -string "IPlay" "$APP_PATH/Info.plist" || echo "CFBundleExecutable已存在"
        
        # 加上iOS 13+必须的Scene配置
        plutil -insert UIApplicationSceneManifest -json '{"UIApplicationSupportsMultipleScenes": false}' "$APP_PATH/Info.plist" || echo "Scene配置已存在"
        
        ls -la "$APP_PATH/"

    - name: Export IPA
      run: |
        mkdir -p ./build/Payload
        cp -r ./build/IPlay.xcarchive/Products/Applications/IPlay.app ./build/Payload/
        cd ./build
        ditto -c -k --sequesterRsrc --keepParent Payload IPlay.ipa
        rm -rf Payload
        ls -lh IPlay.ipa

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: IPlay-IPA
        path: ./build/IPlay.ipa
        retention-days: 30
